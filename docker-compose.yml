services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      # мини-приложение; наружу его публикует Caddy (ниже) или туннель
      - "127.0.0.1:8080:8080"
    # Меньше прав процессу: если через разбор чужого файла (ffmpeg) что-то пойдёт не так, выбраться из контейнера
    # будет сложнее. Остаются только права на свои файлы в ./data.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    pids_limit: 512
    restart: unless-stopped

  # HTTPS для мини-приложения на своём домене. Включается строкой COMPOSE_PROFILES=https в .env
  # (или флагом --profile https). Нужны DOMAIN в .env, A-запись домена на сервер и открытые порты 80/443.
  caddy:
    image: caddy:2
    profiles: ["https"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to bot:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped

  # Туннель fxTunnel — HTTPS для мини-приложения без открытых портов (сервер за NAT, нет файрвола в панели).
  # Включается строкой COMPOSE_PROFILES=tunnel в .env; нужны FXTUNNEL_TOKEN и FXTUNNEL_DOMAIN.
  tunnel:
    build: ./tunnel
    profiles: ["tunnel"]
    # Общая сеть с ботом: localhost:8080 внутри туннеля — это веб-сервер бота.
    network_mode: "service:bot"
    # Сервер управления fxTunnel переехал на fxtun.ru; только TLS, без старого открытого порта 4443.
    command: ["http", "${WEB_PORT:-8080}", "--domain", "${FXTUNNEL_DOMAIN:-}", "--server", "${FXTUNNEL_SERVER:-tunnel.fxtun.ru:443}",
              "--no-inspect", "--log-level", "info"]
    # Токен entrypoint.sh проверяет и передаёт клиенту флагом --token.
    environment:
      FXTUNNEL_TOKEN: ${FXTUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  caddy_data:

networks:
  default:
    driver_opts:
      # Если на VPS соединения из контейнера зависают (а с самого сервера работают), поставьте DOCKER_MTU=1400 в .env
      com.docker.network.driver.mtu: ${DOCKER_MTU:-1500}
